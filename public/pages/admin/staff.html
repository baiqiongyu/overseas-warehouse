<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>员工管理 - 运营后台</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/theme-chalk/index.css">
<link rel="stylesheet" href="../assets/portal.css">
<style>
[v-cloak] { display: none !important; }
body { padding: 4px; }
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.toolbar .spacer { flex: 1; }
.tbl { background: #fff; border: 1px solid rgba(42,38,32,.1); border-radius: 10px; padding: 6px 14px 14px; }
.op button { background: none; border: none; cursor: pointer; font-size: 12.5px; color: var(--ink-2, #3C6151);
  font-family: inherit; padding: 3px 6px; }
.op button.warn { color: var(--danger, #B4533A); }
.op button:hover { text-decoration: underline; }
.st { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; }
.st.on { background: rgba(46,75,63,.1); color: #2E4B3F; }
.st.off { background: rgba(180,83,58,.12); color: #B4533A; }
.role-tag { display: inline-block; font-size: 11.5px; padding: 2px 9px; border-radius: 999px;
  background: rgba(217,160,91,.16); color: #A65E3F; }
.pager { margin-top: 12px; text-align: right; }
</style>
</head>
<body class="portal">
<div id="app" v-cloak>
  <div class="toolbar">
    <el-input v-model.trim="kw" placeholder="邮箱 / 姓名 / 手机号" clearable style="width:230px"
              @keyup.enter.native="search" @clear="search"></el-input>
    <el-button icon="el-icon-search" @click="search">查询</el-button>
    <div class="spacer"></div>
    <button class="btn-primary" type="button" @click="openAdd" v-if="can('staff:create')">+ 新增员工</button>
  </div>

  <div class="tbl">
    <el-table :data="rows" v-loading="loading" empty-text="还没有员工账号">
      <el-table-column prop="realname" label="姓名" min-width="110"></el-table-column>
      <el-table-column prop="email" label="登录邮箱" min-width="190"></el-table-column>
      <el-table-column prop="phone" label="手机号" width="130">
        <template slot-scope="s">{{ s.row.phone || '—' }}</template>
      </el-table-column>
      <el-table-column label="角色" width="140">
        <template slot-scope="s">
          <span class="role-tag" v-if="s.row.role_name">{{ s.row.role_name }}</span>
          <span v-else style="color:#B0AA9C;font-size:12px">未分配</span>
        </template>
      </el-table-column>
      <el-table-column label="状态" width="76" align="center">
        <template slot-scope="s">
          <span class="st" :class="s.row.status === 1 ? 'on' : 'off'">{{ s.row.status === 1 ? '启用' : '停用' }}</span>
        </template>
      </el-table-column>
      <el-table-column prop="last_login_time" label="最后登录" width="150">
        <template slot-scope="s">{{ s.row.last_login_time || '从未' }}</template>
      </el-table-column>
      <el-table-column label="操作" width="220">
        <template slot-scope="s">
          <div class="op">
            <button type="button" v-if="can('staff:update')" @click="openEdit(s.row)">编辑</button>
            <button type="button" v-if="can('staff:status') && s.row.id !== me.admin_id" @click="toggle(s.row)">{{ s.row.status === 1 ? '停用' : '启用' }}</button>
            <button type="button" v-if="can('staff:resetpwd')" @click="resetPwd(s.row)">重置密码</button>
            <button type="button" class="warn" v-if="can('staff:delete') && s.row.id !== me.admin_id" @click="remove(s.row)">删除</button>
          </div>
        </template>
      </el-table-column>
    </el-table>
    <div class="pager">
      <el-pagination layout="total, prev, pager, next" :total="total" :page-size="limit"
                     :current-page.sync="page" @current-change="load"></el-pagination>
    </div>
  </div>

  <el-dialog :title="form.id ? '编辑员工' : '新增员工'" :visible.sync="dlg" width="460px">
    <el-form label-width="82px" size="small">
      <el-form-item label="邮箱" required>
        <el-input v-model.trim="form.email" :disabled="!!form.id" placeholder="登录邮箱"></el-input>
      </el-form-item>
      <el-form-item label="初始密码" required v-if="!form.id">
        <el-input v-model="form.password" show-password placeholder="至少 8 位"></el-input>
      </el-form-item>
      <el-form-item label="姓名" required>
        <el-input v-model.trim="form.realname"></el-input>
      </el-form-item>
      <el-form-item label="手机号">
        <el-input v-model.trim="form.phone"></el-input>
      </el-form-item>
      <el-form-item label="角色">
        <el-select v-model="form.role_id" clearable placeholder="暂不分配" style="width:100%">
          <el-option v-for="r in roles" :key="r.id" :value="r.id" :label="r.name"></el-option>
        </el-select>
      </el-form-item>
    </el-form>
    <div slot="footer">
      <el-button @click="dlg = false">取 消</el-button>
      <el-button type="primary" :loading="saving" @click="save">保 存</el-button>
    </div>
  </el-dialog>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.6.14/vue.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/index.js"></script>
<script>
var API = 'http://127.0.0.1:8088/admin';
var TOKEN = localStorage.getItem('hw_admin_token') || '';
new Vue({
  el: '#app',
  data: {
    me: JSON.parse(localStorage.getItem('hw_admin_user') || '{}'),
    perms: JSON.parse(localStorage.getItem('hw_admin_perms') || '["*"]'),
    rows: [], total: 0, page: 1, limit: 20, kw: '', loading: false,
    roles: [], dlg: false, saving: false,
    form: { id: 0, email: '', password: '', realname: '', phone: '', role_id: null }
  },
  methods: {
    can: function (k) {
      return this.perms.indexOf('*') >= 0 || this.perms.indexOf(k) >= 0;
    },
    load: function () {
      var vm = this; vm.loading = true;
      fetch(API + '/staff/list?page=' + vm.page + '&limit=' + vm.limit + '&keyword=' + encodeURIComponent(vm.kw),
        { headers: { token: TOKEN } })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          vm.loading = false;
          if (j.code === 0) { vm.rows = j.data; vm.total = j.count; }
          else if (j.code === 401) { location.href = 'login.html'; }
          else { vm.$message.error(j.msg || '加载失败'); }
        });
    },
    search: function () { this.page = 1; this.load(); },
    loadRoles: function () {
      var vm = this;
      fetch(API + '/role/all', { headers: { token: TOKEN } })
        .then(function (r) { return r.json(); })
        .then(function (j) { if (j.code === 0) { vm.roles = j.data; } });
    },
    openAdd: function () {
      this.form = { id: 0, email: '', password: '', realname: '', phone: '', role_id: null };
      this.dlg = true;
    },
    openEdit: function (row) {
      this.form = { id: row.id, email: row.email, password: '', realname: row.realname,
        phone: row.phone, role_id: row.role_id || null };
      this.dlg = true;
    },
    save: function () {
      var vm = this;
      vm.saving = true;
      var body = { realname: vm.form.realname, phone: vm.form.phone, role_id: vm.form.role_id || 0 };
      var url;
      if (vm.form.id) {
        url = '/staff/update'; body.id = vm.form.id;
      } else {
        url = '/staff/create';
        body.email = vm.form.email; body.password = vm.form.password;
      }
      fetch(API + url, { method: 'POST', headers: { 'Content-Type': 'application/json', token: TOKEN },
        body: JSON.stringify(body) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          vm.saving = false;
          if (j.code === 0) { vm.$message.success(j.msg); vm.dlg = false; vm.load(); }
          else { vm.$message.error(j.msg || '保存失败'); }
        })
        .catch(function () { vm.saving = false; vm.$message.error('网络错误'); });
    },
    toggle: function (row) {
      var vm = this;
      vm.$confirm('确定' + (row.status === 1 ? '停用' : '启用') + '「' + row.realname + '」吗？', '提示', { type: 'warning' })
        .then(function () {
          return fetch(API + '/staff/status', { method: 'POST', headers: { 'Content-Type': 'application/json', token: TOKEN },
            body: JSON.stringify({ id: row.id, status: row.status === 1 ? 0 : 1 }) }).then(function (r) { return r.json(); });
        })
        .then(function (j) { if (j && j.code === 0) { vm.$message.success(j.msg); vm.load(); } })
        .catch(function () {});
    },
    resetPwd: function (row) {
      var vm = this;
      vm.$prompt('为「' + row.realname + '」设置新密码（至少 8 位）', '重置密码', { inputType: 'password' })
        .then(function (o) {
          return fetch(API + '/staff/resetpwd', { method: 'POST', headers: { 'Content-Type': 'application/json', token: TOKEN },
            body: JSON.stringify({ id: row.id, password: o.value }) }).then(function (r) { return r.json(); });
        })
        .then(function (j) { if (j && j.code === 0) { vm.$message.success(j.msg); } else if (j) { vm.$message.error(j.msg); } })
        .catch(function () {});
    },
    remove: function (row) {
      var vm = this;
      vm.$confirm('确定删除「' + row.realname + '」吗？删除后该邮箱可被重新注册。', '删除', { type: 'warning' })
        .then(function () {
          return fetch(API + '/staff/delete', { method: 'POST', headers: { 'Content-Type': 'application/json', token: TOKEN },
            body: JSON.stringify({ id: row.id }) }).then(function (r) { return r.json(); });
        })
        .then(function (j) { if (j && j.code === 0) { vm.$message.success(j.msg); vm.load(); } })
        .catch(function () {});
    }
  },
  mounted: function () {
    // index 页把 perms 存到 localStorage，供按钮级控制
    var vm = this;
    fetch(API + '/auth/me', { headers: { token: TOKEN } })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.code !== 0) { location.href = 'login.html'; return; }
        vm.perms = j.data.perms;
        localStorage.setItem('hw_admin_perms', JSON.stringify(j.data.perms));
      });
    this.load();
    this.loadRoles();
  }
});
</script>
</body>
</html>
