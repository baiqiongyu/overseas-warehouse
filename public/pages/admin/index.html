<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内部运营后台 - 海外仓系统</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.2.5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/theme-chalk/index.css">
<link rel="stylesheet" href="../assets/portal.css">
<style>
:root { --ink: #2E4B3F; --paper: #FAF8F4; --text-light: #F4F1E8; --text-light-muted: #ACB8A9;
  --accent: #D9A05B; --hairline-light: rgba(244,241,232,.14);
  --font-display: 'Noto Serif SC', serif; --font-body: 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
* { box-sizing: border-box; margin: 0; }
[v-cloak] { display: none !important; }
html, body, #app { height: 100%; }
body { font-family: var(--font-body); background: var(--paper); overflow: hidden; }

.topbar { height: 56px; background: linear-gradient(90deg, #22382F, #2E4B3F); color: var(--text-light);
  display: flex; align-items: center; padding: 0 22px; gap: 22px; }
.topbar .mark { width: 30px; height: 30px; border-radius: 7px; background: rgba(244,241,232,.12);
  display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; flex: none; }
.topbar .brand { flex: none; }
.topbar .name { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: .04em; }
.topbar .en { font-size: 9px; letter-spacing: .2em; color: var(--text-light-muted); margin-top: 2px; }

/* 顶部模块导航 */
.mnav { display: flex; align-items: center; gap: 4px; height: 100%; flex: 1; min-width: 0; overflow-x: auto; }
.mnav::-webkit-scrollbar { display: none; }
.mnav a { display: flex; align-items: center; gap: 6px; height: 100%; padding: 0 16px;
  font-size: 13.5px; color: var(--text-light-muted); cursor: pointer; white-space: nowrap;
  border-bottom: 2px solid transparent; transition: color 140ms, border-color 140ms; }
.mnav a:hover { color: var(--text-light); }
.mnav a.active { color: #fff; font-weight: 600; border-bottom-color: var(--accent); }
.mnav a i { font-size: 15px; }
.mnav .empty { font-size: 12px; color: var(--text-light-muted); white-space: nowrap; }

.topbar .spacer { flex: none; }
.topbar .who { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-light-muted); flex: none; }
.topbar .who b { color: var(--text-light); font-weight: 500; }
.topbar .who .tag { background: var(--accent); color: #22382F; font-size: 11px; padding: 2px 8px;
  border-radius: 999px; font-weight: 600; }
.topbar .out { background: none; border: 1px solid var(--hairline-light); color: var(--text-light-muted);
  border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: var(--font-body); }
.topbar .out:hover { color: #fff; border-color: rgba(244,241,232,.4); }

.shell { display: flex; height: calc(100% - 56px); }
.sidebar { width: 200px; flex: none; background: #fff; border-right: 1px solid rgba(42,38,32,.1);
  overflow-y: auto; padding: 12px 10px; }
.sidebar .grp { font-size: 11px; letter-spacing: .12em; color: #B0AA9C; padding: 4px 12px 8px; }
.sidebar a { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 7px;
  font-size: 13.5px; color: #4A463D; cursor: pointer; text-decoration: none; margin-bottom: 2px;
  transition: background 140ms; }
.sidebar a:hover { background: #F2EFE8; }
.sidebar a.active { background: rgba(46,75,63,.09); color: var(--ink); font-weight: 600;
  box-shadow: inset 3px 0 0 var(--accent); }
.sidebar a i { font-size: 15px; color: #8a8577; }
.sidebar a.active i { color: var(--ink); }
.sidebar .empty { font-size: 12px; color: #B0AA9C; padding: 18px 12px; line-height: 1.7; }

.main { flex: 1; min-width: 0; padding: 16px; }
.main iframe { width: 100%; height: 100%; border: none; background: transparent; border-radius: 10px; }
</style>
</head>
<body>
<div id="app" v-cloak>
  <header class="topbar">
    <span class="mark">仓</span>
    <div class="brand"><div class="name">海外仓 · 运营后台</div><div class="en">ADMIN CONSOLE</div></div>
    <!-- 顶部：一级模块 -->
    <nav class="mnav">
      <a v-for="m in topModules" :key="'t' + m.id"
         :class="{ active: activeId === m.id }" @click="selectModule(m)">
        <i :class="m.icon || 'el-icon-menu'"></i>{{ m.title }}
      </a>
      <span class="empty" v-if="loaded && !topModules.length">当前角色没有配置任何菜单，请联系管理员授权。</span>
    </nav>
    <div class="spacer"></div>
    <div class="who">
      <b>{{ user.realname || '—' }}</b>
      <span class="tag">{{ user.is_super ? '超管' : (user.role_name || '未分配角色') }}</span>
      <button class="out" @click="logout">退出</button>
    </div>
  </header>
  <div class="shell">
    <!-- 左侧：当前模块下的页面 / 栏目 -->
    <nav class="sidebar">
      <div class="grp" v-if="sidePages.length">{{ activeTitle }}</div>
      <a v-for="p in sidePages" :key="'p' + p.id"
         :class="{ active: current === p.path }" @click="go(p)">
        <i :class="p.icon || 'el-icon-document'"></i>{{ p.title }}
      </a>
      <div class="empty" v-if="loaded && activeId && !sidePages.length && !activeIsPage">
        该模块下暂无页面菜单。
      </div>
    </nav>
    <section class="main">
      <iframe :src="frameSrc" key="frame"></iframe>
    </section>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.6.14/vue.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/index.js"></script>
<script>
var API = 'http://127.0.0.1:8088/admin';
new Vue({
  el: '#app',
  data: { user: {}, menus: [], current: '', frameSrc: 'dashboard.html', activeId: null, loaded: false },
  computed: {
    // 顶部模块 = 所有顶级节点（目录或直接挂的页面）
    topModules: function () { return this.menus; },
    // 当前选中的顶级节点
    activeNode: function () {
      var vm = this;
      return vm.menus.filter(function (m) { return m.id === vm.activeId; })[0] || null;
    },
    activeTitle: function () { return this.activeNode ? this.activeNode.title : ''; },
    // 顶级直接是页面时，侧栏不再重复展示
    activeIsPage: function () { return this.activeNode ? this.activeNode.type === 2 : false; },
    // 左侧栏目 = 当前模块下的页面菜单
    sidePages: function () {
      var node = this.activeNode;
      if (!node || node.type !== 1) { return []; }
      return (node.children || []).filter(function (c) { return c.type === 2; });
    }
  },
  methods: {
    go: function (p) {
      if (!p.path) { return; }
      this.current = p.path;
      this.frameSrc = p.path + '.html';
      try { localStorage.setItem('hw_admin_last', p.path); } catch (e) {}
    },
    // 点击顶部模块：切换 activeId 并跳到该模块第一个页面
    selectModule: function (m) {
      this.activeId = m.id;
      if (m.type === 2) { this.go(m); return; } // 顶级直接是页面
      var pages = (m.children || []).filter(function (c) { return c.type === 2; });
      if (pages.length) { this.go(pages[0]); }
    },
    logout: function () {
      var vm = this;
      vm.$confirm('确定退出登录吗？', '提示', { type: 'info' }).then(function () {
        fetch(API + '/auth/logout', { method: 'POST', headers: { token: localStorage.getItem('hw_admin_token') || '' } });
        localStorage.removeItem('hw_admin_token');
        localStorage.removeItem('hw_admin_user');
        location.href = 'login.html';
      }).catch(function () {});
    },
    bootstrap: function () {
      var vm = this;
      var tk = localStorage.getItem('hw_admin_token');
      if (!tk) { location.href = 'login.html'; return; }
      fetch(API + '/auth/me', { headers: { token: tk } })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j.code === 0) {
            vm.user = j.data.user;
            vm.menus = j.data.menus;
            vm.loaded = true;
            // 恢复上次访问的页面，并高亮其所属模块
            var last = localStorage.getItem('hw_admin_last');
            var hitPage = null, hitModule = null;
            vm.menus.forEach(function (m) {
              if (m.type === 2 && m.path === last) { hitPage = m; hitModule = m; }
              (m.children || []).forEach(function (p) {
                if (p.path === last) { hitPage = p; hitModule = m; }
              });
            });
            if (hitPage) {
              vm.activeId = hitModule.id;
              vm.go(hitPage);
            } else {
              vm.selectModule(vm.menus[0] || { id: null, type: 1, children: [] });
            }
          } else {
            localStorage.removeItem('hw_admin_token');
            location.href = 'login.html';
          }
        })
        .catch(function () { location.href = 'login.html'; });
    }
  },
  mounted: function () { this.bootstrap(); }
});
</script>
</body>
</html>
