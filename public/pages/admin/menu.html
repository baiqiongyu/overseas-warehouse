<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>菜单管理 - 运营后台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/theme-chalk/index.css">
<link rel="stylesheet" href="../assets/portal.css">
<style>
[v-cloak] { display: none !important; }
body { padding: 4px; }
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.toolbar .hint { font-size: 12.5px; color: var(--text-muted, #6E6A61); }
.toolbar .spacer { flex: 1; }
.tbl { background: #fff; border: 1px solid rgba(42,38,32,.1); border-radius: 10px; padding: 6px 14px 14px; }
.t-icon { width: 20px; height: 20px; border-radius: 5px; display: inline-flex; align-items: center;
  justify-content: center; font-size: 11px; color: #fff; margin-right: 6px; vertical-align: middle; }
.t1 { background: #2E4B3F; } .t2 { background: #3C6151; } .t3 { background: #A65E3F; }
.path-code { font-family: Consolas, monospace; font-size: 12px; color: #A65E3F; }
.st-off { color: #B4533A; font-size: 12px; }
.op button { background: none; border: none; cursor: pointer; font-size: 12.5px; color: #3C6151;
  font-family: inherit; padding: 3px 6px; }
.op button.warn { color: #B4533A; }
.op button:hover { text-decoration: underline; }
</style>
</head>
<body class="portal">
<div id="app" v-cloak>
  <div class="toolbar">
    <span class="hint">模块（目录）→ 页面菜单 → 按钮权限，三级结构；页面「路由 key」对应 pages/admin/ 下的同名 html，按钮「权限标识」供代码做操作级校验</span>
    <div class="spacer"></div>
    <button class="btn-primary" type="button" @click="openAdd(0, 1)" v-if="can('menu:create')">+ 新增模块</button>
  </div>

  <div class="tbl">
    <el-table :data="tree" v-loading="loading" row-key="id" default-expand-all
              :tree-props="{ children: 'children' }" empty-text="还没有菜单，先新增一个模块">
      <el-table-column label="名称" min-width="240">
        <template slot-scope="s">
          <span class="t-icon" :class="'t' + s.row.type">{{ s.row.type === 1 ? '模' : s.row.type === 2 ? '页' : '钮' }}</span>
          {{ s.row.title }}
          <span v-if="s.row.status === 0" class="st-off">（已停用）</span>
        </template>
      </el-table-column>
      <el-table-column label="路由 / 权限标识" min-width="170">
        <template slot-scope="s">
          <span class="path-code" v-if="s.row.path">{{ s.row.path }}</span>
          <span v-else style="color:#B0AA9C;font-size:12px">—</span>
        </template>
      </el-table-column>
      <el-table-column prop="sort" label="排序" width="64" align="center"></el-table-column>
      <el-table-column label="操作" width="240">
        <template slot-scope="s">
          <div class="op">
            <button type="button" v-if="s.row.type === 1 && can('menu:create')" @click="openAdd(s.row.id, 2)">+页面</button>
            <button type="button" v-if="s.row.type === 2 && can('menu:create')" @click="openAdd(s.row.id, 3)">+按钮</button>
            <button type="button" v-if="can('menu:update')" @click="openEdit(s.row)">编辑</button>
            <button type="button" v-if="can('menu:status')" @click="toggle(s.row)">{{ s.row.status === 1 ? '停用' : '启用' }}</button>
            <button type="button" class="warn" v-if="can('menu:delete')" @click="remove(s.row)">删除</button>
          </div>
        </template>
      </el-table-column>
    </el-table>
  </div>

  <el-dialog :title="dlgTitle" :visible.sync="dlg" width="440px">
    <el-form label-width="92px" size="small">
      <el-form-item label="类型" required>
        <el-radio-group v-model="form.type" :disabled="!!form.id">
          <el-radio :label="1">模块目录</el-radio>
          <el-radio :label="2">页面菜单</el-radio>
          <el-radio :label="3">按钮权限</el-radio>
        </el-radio-group>
      </el-form-item>
      <el-form-item label="上级节点">
        <span style="font-size:13px">{{ parentTitle || '（顶级）' }}</span>
      </el-form-item>
      <el-form-item label="名称" required>
        <el-input v-model.trim="form.title" placeholder="如：收货作业 / 新增员工"></el-input>
      </el-form-item>
      <el-form-item :label="form.type === 2 ? '路由 key' : '权限标识'" v-if="form.type !== 1" required>
        <el-input v-model.trim="form.path"
                  :placeholder="form.type === 2 ? '对应 pages/admin/xxx.html，如 receiving' : '如 staff:create'"></el-input>
      </el-form-item>
      <el-form-item label="图标" v-if="form.type !== 3">
        <el-input v-model.trim="form.icon" placeholder="Element 图标类名，如 el-icon-box（选填）"></el-input>
      </el-form-item>
      <el-form-item label="排序">
        <el-input-number v-model="form.sort" :min="0" :max="999" size="small"></el-input-number>
      </el-form-item>
    </el-form>
    <div slot="footer">
      <el-button @click="dlg = false">取 消</el-button>
      <el-button type="primary" :loading="saving" @click="save">保 存</el-button>
    </div>
  </el-dialog>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.6.14/vue.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/index.js"></script>
<script>
var API = 'http://127.0.0.1:8088/admin';
var TOKEN = localStorage.getItem('hw_admin_token') || '';
function api(url, body) {
  return fetch(API + url, {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json', token: TOKEN },
    body: body ? JSON.stringify(body) : null
  }).then(function (r) { return r.json(); });
}
new Vue({
  el: '#app',
  data: {
    perms: JSON.parse(localStorage.getItem('hw_admin_perms') || '["*"]'),
    tree: [], loading: false, dlg: false, saving: false,
    form: { id: 0, pid: 0, type: 1, title: '', path: '', icon: '', sort: 0 },
    parentTitle: ''
  },
  computed: {
    dlgTitle: function () { return this.form.id ? '编辑「' + this.form.title + '」' : '新增' + (this.form.type === 1 ? '模块' : this.form.type === 2 ? '页面' : '按钮'); }
  },
  methods: {
    can: function (k) { return this.perms.indexOf('*') >= 0 || this.perms.indexOf(k) >= 0; },
    load: function () {
      var vm = this; vm.loading = true;
      api('/menu/tree').then(function (j) {
        vm.loading = false;
        if (j.code === 0) { vm.tree = j.data; }
        else if (j.code === 401) { location.href = 'login.html'; }
      });
    },
    findTitle: function (list, id) {
      var vm = this, hit = '';
      (function walk(arr) {
        arr.forEach(function (n) {
          if (n.id === id) { hit = n.title; }
          walk(n.children || []);
        });
      })(list || []);
      return hit;
    },
    openAdd: function (pid, type) {
      this.form = { id: 0, pid: pid, type: type, title: '', path: '', icon: '', sort: 0 };
      this.parentTitle = pid ? this.findTitle(this.tree, pid) : '';
      this.dlg = true;
    },
    openEdit: function (row) {
      this.form = { id: row.id, pid: row.pid, type: row.type, title: row.title, path: row.path,
        icon: row.icon, sort: row.sort };
      this.parentTitle = row.pid ? this.findTitle(this.tree, row.pid) : '';
      this.dlg = true;
    },
    save: function () {
      var vm = this;
      vm.saving = true;
      var p = vm.form.id ? api('/menu/update', vm.form) : api('/menu/create', vm.form);
      p.then(function (j) {
        vm.saving = false;
        if (j.code === 0) { vm.$message.success(j.msg); vm.dlg = false; vm.load(); }
        else { vm.$message.error(j.msg || '保存失败'); }
      }).catch(function () { vm.saving = false; });
    },
    toggle: function (row) {
      var vm = this;
      api('/menu/status', { id: row.id, status: row.status === 1 ? 0 : 1 }).then(function (j) {
        if (j.code === 0) { vm.$message.success(j.msg); vm.load(); }
      });
    },
    remove: function (row) {
      var vm = this;
      vm.$confirm('确定删除「' + row.title + '」吗？', '删除', { type: 'warning' })
        .then(function () { return api('/menu/delete', { id: row.id }); })
        .then(function (j) { if (j && j.code === 0) { vm.$message.success(j.msg); vm.load(); } else if (j) { vm.$message.error(j.msg); } })
        .catch(function () {});
    }
  },
  mounted: function () {
    var vm = this;
    api('/auth/me').then(function (j) {
      if (j.code !== 0) { location.href = 'login.html'; return; }
      vm.perms = j.data.perms;
      localStorage.setItem('hw_admin_perms', JSON.stringify(j.data.perms));
    });
    this.load();
  }
});
</script>
</body>
</html>
